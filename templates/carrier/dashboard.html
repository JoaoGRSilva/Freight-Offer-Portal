<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Portal da Transportadora</title>
</head>

<body>

    <header>

        <h2>Portal da Transportadora</h2>

        <p>{{ user.carrier_name }}</p>

        <form method="POST"
              action="{{ url_for('auth.logout') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ auth_csrf_token() }}">

            <button type="submit">Sair</button>

        </form>

    </header>

    <main>

        <h1>Bem-vindo, {{ user.name }}</h1>

        <p>Suas ofertas e negociações aparecerão aqui.</p>

    </main>

</body>

</html>
